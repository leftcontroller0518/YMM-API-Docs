code: |
  public interface IAudioEffectProcessor : IAudioStream, IDisposable
remarks: |
  `AudioEffectBase.CreateAudioEffect` の戻り値として実装します。
  `IAudioStream` を実装することで、YMM4の音声パイプラインに組み込まれます。
  `Input` プロパティーに前段の音声ストリームが設定されます。

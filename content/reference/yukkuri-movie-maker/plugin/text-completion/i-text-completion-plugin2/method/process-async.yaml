code: |
  Task<string> ProcessAsync(string systemPrompt, string text, Bitmap? image);
remarks: |
  `systemPrompt` はYMM4が生成するシステムプロンプトです。`text` はユーザーが入力したテキストです。
  `image` は現在のプレビューフレームのスクリーンショットで、画像対応モデルを使う場合に利用できます。
  補完結果のテキストを返してください。エラー時は例外をスローしてください。

code: |
  IAsyncEnumerable<TranscriptionSegment> ProcessAsync(ITranscriptionProcessArgs args, CancellationToken token);
remarks: |
  `args.CreateAudioStream()` で音声データを取得できます。
  セグメントを `yield return` で逐次返すことで進捗をリアルタイムに反映できます。
  キャンセルを要求された場合は `token.ThrowIfCancellationRequested()` を呼び出してください。

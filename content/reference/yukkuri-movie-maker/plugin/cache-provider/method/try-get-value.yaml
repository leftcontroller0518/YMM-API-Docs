code: |
  public bool TryGetValue<T>(string filePath, [NotNullWhen(true)] out T? source) where T : class, IDisposable
remarks: |
  型パラメーター `T` でフィルタリングします。同じキーに複数の型のオブジェクトが存在する場合、`T` に一致するものだけが対象です。

id: "T:YukkuriMovieMaker.Plugin.Effects.VideoEffectBase"
type: class
name: "YukkuriMovieMaker.Plugin.Effects.VideoEffectBase"
namespace: "YukkuriMovieMaker.Plugin.Effects"
accessibility: public
assembly: "YukkuriMovieMaker.Plugin.dll"
summary: "映像エフェクトの基底クラスです。"
externalInheritance:
  - type:
      kind: named
      name: System.Object
  - type:
      kind: named
      name: YukkuriMovieMaker.Commons.Animatable
base:
  type:
    kind: named
    name: YukkuriMovieMaker.Commons.Animatable
implements:
  - type:
      kind: named
      name: YukkuriMovieMaker.Plugin.Effects.IVideoEffect
code: |
  public abstract class VideoEffectBase : Animatable, IVideoEffect
remarks: |
  映像エフェクトプラグインを実装する場合はこのクラスを継承してください。
  継承クラスには `[VideoEffect]` 属性を付与する必要があります。

  コンストラクターは、`Animatable` が保有するアニメーション可能プロパティ（`Animation` 型）の `UndoRedoCommandCreated` イベントを自動的に購読します。
  これにより、アニメーションの変更が `PropertyChanged` イベントの `Label` 通知として伝播します。

  プロパティーの変更通知とUndo/Redo登録には `Set` メソッドを使用してください。
  プロパティーに `IUndoRedoable` を実装したオブジェクト（`Animation` など）を設定する場合、
  `Set` メソッドが自動的に古い値のイベント解除・新しい値のイベント購読を行います。
examples: |
  ```csharp
  [VideoEffect("サンプルエフェクト", ["サンプル"], [])]
  public class SampleVideoEffect : VideoEffectBase
  {
      public override string Label => "サンプルエフェクト";

      [Display(Name = "強度")]
      [AnimationSlider("F0", "%", 0, 100)]
      public Animation Intensity { get; } = new Animation(50, 0, 100);

      public override IVideoEffectProcessor CreateVideoEffect(IGraphicsDevicesAndContext devices)
          => new SampleVideoEffectProcessor(devices, this);

      public override IEnumerable<string> CreateExoVideoFilters(int keyFrameIndex, ExoOutputDescription exo)
          => [];
  }
  ```

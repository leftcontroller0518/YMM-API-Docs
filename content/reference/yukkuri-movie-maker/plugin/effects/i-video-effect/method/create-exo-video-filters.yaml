id: "M:YukkuriMovieMaker.Plugin.Effects.IVideoEffect.CreateExoVideoFilters(System.Int32,YukkuriMovieMaker.Exo.ExoOutputDescription)"
type: method
name: "CreateExoVideoFilters"
namespace: "YukkuriMovieMaker.Plugin.Effects"
accessibility: public
assembly: "YukkuriMovieMaker.Plugin.dll"
summary: "AviUtl拡張編集（.exo）用のフィルター文字列を生成します。"
declaringType:
  id: "T:YukkuriMovieMaker.Plugin.Effects.IVideoEffect"
parameters:
  - name: keyFrameIndex
    type:
      type:
        kind: named
        name: System.Int32
  - name: exoOutputDescription
    type:
      type:
        kind: named
        name: YukkuriMovieMaker.Exo.ExoOutputDescription
returns:
  type:
    kind: named
    name: System.Collections.Generic.IEnumerable
  genericArguments:
    - type:
        kind: named
        name: System.String
code: |
  IEnumerable<string> CreateExoVideoFilters(int keyFrameIndex, ExoOutputDescription exoOutputDescription);
remarks: |
  `IsAviUtlSupported` が `false` の場合、この戻り値は使用されません。
  AviUtl出力に対応しない場合は空のシーケンスを返してください。
examples: |
  ```csharp
  public override IEnumerable<string> CreateExoVideoFilters(int keyFrameIndex, ExoOutputDescription exoOutputDescription)
  {
      var fps = exoOutputDescription.VideoInfo.FPS;
      yield return
          $"_name=ぼかし\r\n" +
          $"_disable={(IsEnabled ? 1 : 0)}\r\n" +
          $"範囲={Blur.ToExoString(keyFrameIndex, "F0", fps)}\r\n";
  }
  ```

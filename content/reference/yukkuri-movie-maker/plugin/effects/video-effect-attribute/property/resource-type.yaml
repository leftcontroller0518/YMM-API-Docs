remarks: |
  `null`（既定）の場合、`Name` および `Categories` の各文字列は `"YMM4Key_"` プレフィックスを持つキーかどうかのみチェックされます。
  多言語対応のリソースクラスを指定した場合、そのクラスの静的プロパティーから文字列を解決します。

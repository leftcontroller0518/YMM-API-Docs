code: |
  Task<IVoicePronounce?> CreateVoiceAsync(string text, IVoicePronounce? pronounce, IVoiceParameter? parameter, string filePath);
remarks: |
  音声を合成して `filePath` にWAVファイルとして書き出してください。
  `pronounce` は前回生成時の読み情報で、再利用できる場合はそのまま返せます。
  戻り値の `IVoicePronounce` はリップシンクや読み調整情報を含みます。
  失敗した場合は `null` を返してください。

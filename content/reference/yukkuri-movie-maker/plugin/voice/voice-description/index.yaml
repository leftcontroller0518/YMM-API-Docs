code: |
  public class VoiceDescription
remarks: |
  YMM4はキャラクター設定に話者を保存する際にこのクラスを使用します。
  プロジェクトファイルには `API` と `Arg`（話者ID）のみが保存され、
  起動時に対応する `IVoiceSpeaker` が `Speaker` プロパティーにセットされます。

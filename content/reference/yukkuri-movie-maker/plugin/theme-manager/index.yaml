remarks: |
  プラグインがWPFカスタムコントロールを提供する場合、テーマ変更に対応するために `ThemeChanged` イベントを購読してください。
  `LoadTheme` は `Application.Current.Resources.MergedDictionaries[1]` を直接書き換えるため、WPFアプリケーションが起動中でないと使用できません。

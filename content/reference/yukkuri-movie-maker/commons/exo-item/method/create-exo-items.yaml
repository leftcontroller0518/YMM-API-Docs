code: |
  public static IEnumerable<ExoItem> CreateExoItems(int start, int end, int layer, int group, int[] keyFrames, bool isClipping)
remarks: |
  `keyFrames` はアイテム先頭からのフレームオフセット配列です。
  キーフレーム間ごとに1つの `ExoItem` を生成し、2個目以降は `IsChained = true` になります。
  `CreateExoVideoFilters` の `keyFrameIndex` に対応するアイテムに各フィルターを追加してください。

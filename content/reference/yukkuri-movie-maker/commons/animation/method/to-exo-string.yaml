id: "M:YukkuriMovieMaker.Commons.Animation.ToExoString(System.Int32,System.String,System.Int32,System.Func{System.Double,System.Double})"
type: method
name: "ToExoString"
namespace: "YukkuriMovieMaker.Commons"
accessibility: public
assembly: "YukkuriMovieMaker.Plugin.dll"
summary: "AviUtl拡張編集（.exo）用のパラメーター文字列を生成して返します。"
declaringType:
  id: "T:YukkuriMovieMaker.Commons.Animation"
parameters:
  - name: keyFrameIndex
    type:
      type:
        kind: named
        name: System.Int32
  - name: format
    type:
      type:
        kind: named
        name: System.String
  - name: fps
    type:
      type:
        kind: named
        name: System.Int32
  - name: converter
    type:
      type:
        kind: named

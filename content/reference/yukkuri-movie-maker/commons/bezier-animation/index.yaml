remarks: |
  `Animation` が `AnimationType` として `Linear_Bezier` / `Interpolation_Bezier` を選択したときに使用されます。
  `GetAnimation(rate)` で 0.0〜1.0 の入力に対するイージング適用後の値（同じく 0.0〜1.0）を返します。
  `Points` プロパティーを変更すると `Changed` イベントが発火します。
  プラグインから直接触る必要は通常ありません。UIが管理します。
